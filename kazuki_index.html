<script>
var mx={n:25,a:25,r:20,na:20,rt:15,k:15,b:20,bi:15,x1:15,x2:15}, rate=[0,1,.8,.6,.3,0];
document.getElementById("calc").onclick=function(){
 var cs=document.querySelectorAll(".card"),rows=[];
 for(var i=0;i<cs.length;i++){var s=0;for(var k in mx){var e=cs[i].querySelector('[data-k="'+k+'"]');s+=mx[k]*rate[Number(e.value)];}rows.push({n:i+1,s:Math.round(s*10)/10});}
 rows.sort(function(a,b){return b.s-a.s||a.n-b.n});
 var marks=["◎","○","▲","☆"],out="";
 for(var j=0;j<rows.length;j++)out+='<div class="row"><span class="rank">'+(j+1)+'位</span><span class="mark">'+(marks[j]||"・")+'</span><span class="horse">'+rows[j].n+'番</span><span class="score">'+rows[j].s+'点</span></div>';
 document.getElementById("ranking").innerHTML=out;var r=document.getElementById("results");r.style.display="block";r.scrollIntoView({behavior:"smooth"});
};
